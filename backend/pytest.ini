[pytest]
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*
addopts = -q --strict-markers
markers =
    security: privacy and security invariants — a failure here means client data is at risk
    slow: tests that touch the network or large sample files
filterwarnings =
    ignore::DeprecationWarning:starlette.*
